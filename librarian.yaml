      checksum: 7fbdc5b9d08e58a2aa7b72c1ee407cac69e56d179fe623d27ac806419b8a3359
      build:
        - pnpm install --frozen-lockfile --config.auto-install-peers=true
        - pnpm run compile
        - pnpm add -g "$PWD"
      src_dir: core/generator/gapic-generator-typescript
    - name: gapic-node-processing
      version: 0.1.11
    - name: gapic-tools
      version: 1.1.0
    - name: protobufjs
      version: 7.5.8
