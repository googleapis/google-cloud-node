name: "Check PNPM Lockfile and Install Workspace Dependencies"
description: "Sets up pnpm, verifies frozen lockfile sync, and links in-repo workspace packages"
inputs:
  link-workspace-packages:
    description: "Whether to link matching in-repo workspace packages after verifying the frozen lockfile"
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
    - name: Install Workspace Dependencies (Frozen Lockfile)
      shell: bash
      run: |
        if ! pnpm install --frozen-lockfile --ignore-scripts; then
          echo "::error title=PNPM Lockfile Out of Date::The pnpm-lock.yaml file is out of sync with workspace package.json dependencies."
          echo ""
          echo "===================================================================================================="
          echo "❌ PNPM Lockfile Out of Date (ERR_PNPM_OUTDATED_LOCKFILE)"
          echo ""
          echo "One or more package.json files have changed or were merged without updating pnpm-lock.yaml."
          echo ""
          echo "To resolve this failure, please update the lockfile locally and commit the result:"
          echo "    pnpm install --lockfile-only"
          echo "    git add pnpm-lock.yaml"
          echo "    git commit -m \"chore: update pnpm-lock.yaml\""
          echo "    git push"
          echo "===================================================================================================="
          echo ""
          exit 1
        fi
    - name: Link In-Repo Workspace Packages
      if: ${{ inputs.link-workspace-packages == 'true' }}
      shell: bash
      run: |
        pnpm install --config.link-workspace-packages=deep --config.prefer-workspace-packages=true --no-frozen-lockfile --resolution-only --ignore-scripts --prefer-offline
        rm -f node_modules/.pnpm-workspace-state.json
        pnpm install --config.link-workspace-packages=deep --config.prefer-workspace-packages=true --no-frozen-lockfile --ignore-scripts --prefer-offline
        git checkout -- pnpm-lock.yaml
        pnpm --dir core/packages/gaxios run compile
        pnpm --dir core/packages/teeny-request run compile
        pnpm --dir core/packages/google-auth-library-nodejs run compile
