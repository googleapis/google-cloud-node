name: zizmor

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor (${{ matrix.persona }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        persona: [pedantic, auditor]
    permissions:
      security-events: write # Required to upload SARIF results to GitHub Code Scanning
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4.2.2
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@195d10ad90f31d8cd6ea1efd6ecc12969ddbe73f # v0.5.1
        with:
          persona: ${{ matrix.persona }}
