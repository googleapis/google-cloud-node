# Github action job to test core java library features on
# downstream client libraries before they are released.
permissions:
  contents: read

on:
  push:
    branches:
    - main
    paths:
    - 'handwritten/bigtable/**'
  pull_request:
    paths:
    - 'handwritten/bigtable/**'
name: bigtable-conformance
jobs:
  conformance:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: handwritten/bigtable
    strategy:
      matrix:
        node: [ 18, 20 ]
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      with:
        persist-credentials: false
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
      with:
        repository: googleapis/cloud-bigtable-clients-test
        ref: main
        path: handwritten/bigtable/cloud-bigtable-clients-test
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
      with:
        node-version: ${{ matrix.node }}
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '>=1.20.2'
    - run: chmod +x .kokoro/conformance.sh
    - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4
    - run: pnpm install --frozen-lockfile --ignore-scripts
    - run: pnpm --filter ...{handwritten/bigtable} run --if-present compile
    - run: go version
    - run: .kokoro/conformance.sh
