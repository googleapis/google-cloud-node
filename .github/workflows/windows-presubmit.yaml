on:
  pull_request:
name: presubmit-windows
jobs:
  units:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 300
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@v4
        with:
          cache: true
      - run: node --version
      - run: pnpm install
      - run: pnpm --filter "{packages/**}" --filter "!gapic-node-processing" --filter "!@google-cloud/typeless-sample-bot" run test
        name: Run package/* unit tests (with exclusions for Windows compatibility)
      - run: pnpm --filter "{containers/**}" run test
        name: Run containers/* unit tests
      - run: ci/run_conditional_tests.sh
        name: Run core, handwritten, and .github/scripts tests
        shell: bash
        env:
          BUILD_TYPE: presubmit
          TEST_TYPE: units