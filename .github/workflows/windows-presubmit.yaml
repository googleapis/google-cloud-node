permissions:
  contents: read

on:
  pull_request:
name: presubmit-windows

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shard-matrix: ${{ steps.set-matrix.outputs.shard_matrix }}
      shard-total: ${{ steps.set-matrix.outputs.shard_total }}
      generator-changed: ${{ steps.changes.outputs.generator }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          filters: |
            generator:
              - 'core/generator/**'
              - '.github/workflows/generator-tests.yaml'
      - id: set-matrix
        uses: ./.github/actions/calculate-shard-matrix
  units:
    needs: setup
    name: units (Node ${{ matrix.node-version }}, Shard ${{ matrix.shard-index }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        shard-index: ${{ fromJSON(needs.setup.outputs.shard-matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/run-unit-tests
        with:
          node-version: ${{ matrix.node-version }}
          shard-total: ${{ needs.setup.outputs.shard-total }}
          shard-index: ${{ matrix.shard-index }}

  wait-for-ci:
    name: Wait for CI
    needs: [setup, units]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Wait for all CI workflows to finish
        uses: ./.github/actions/wait-for-ci
        with:
          generator-changed: ${{ needs.setup.outputs.generator-changed }}

  # Dummy jobs to satisfy branch protection requirements for each node version
  units-status:
    name: units (${{ matrix.node-version }})
    needs: [setup, units, wait-for-ci]
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    env:
      WAIT_FOR_CI_RESULT: ${{ needs.wait-for-ci.result }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Verify CI completion and generator test status
        run: |
          if [ "$WAIT_FOR_CI_RESULT" != "success" ]; then
            echo "CI completion check or generator-tests failed (result: $WAIT_FOR_CI_RESULT)."
            exit 1
          fi
      - name: Check shard status
        uses: ./.github/actions/check-shard-status
        with:
          node-version: ${{ matrix.node-version }}
