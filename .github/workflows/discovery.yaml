name: Update Discovery Generated Types

permissions:
  contents: read

concurrency:
  group: discovery-types-sync
  cancel-in-progress: false

on:
  schedule:
    - cron: '0 12 * * TUE'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # Added for creating issues on failure
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Install root and BigQuery dependencies from the frozen workspace lockfile.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter google-cloud-node --filter @google-cloud/bigquery
      # Generate types and format only the generated declaration file.
      - run: pnpm --dir handwritten/bigquery run types
      - run: pnpm --dir handwritten/bigquery exec prettier --write src/types.d.ts
      # Verify updated types compile and pass BigQuery unit tests before opening a PR.
      - run: pnpm --dir handwritten/bigquery run compile
      - run: pnpm --dir handwritten/bigquery test
      # Submit pull request
      - uses: googleapis/code-suggester@f9fef85aa02459e30e62526abe950341cbbd768b # v5
        env:
          ACCESS_TOKEN: ${{ secrets.YOSHI_CODE_BOT_TOKEN }}
        with:
          command: pr
          upstream_owner: googleapis
          upstream_repo: google-cloud-node
          description: 'Automated pull-request to keep BigQuery Discovery types up-to-date.'
          title: 'chore(bigquery): update types from Discovery'
          message: 'chore(bigquery): update types from Discovery'
          branch: update-discovery-patch
          git_dir: '.'
          fork: true
          force: true
      - name: Create issue on failure
        if: ${{ failure() }}
        uses: googleapis/librarian/.github/actions/create-issue-on-failure@c54791693e09a76a7403f3dc81c7c97782908b3d # v0.53.0
        with:
          title: "Update Discovery Generated Types failed"
          body: "The weekly scheduled task to update Discovery Generated Types failed."
          mention: "@googleapis/cloud-sdk-nodejs-team @googleapis/bigquery-team"
