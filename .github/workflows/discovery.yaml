permissions:
  contents: read

on:
  schedule:
    - cron: '0 12 * * TUE'
  workflow_dispatch:
name: Update Discovery Generated Types
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # Added for creating issues on failure
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Install all deps, including dev dependencies.
      - run: cd handwritten/bigquery && pnpm install --filter .
      # Generate types
      - run: cd handwritten/bigquery && pnpm run types
      # Fix formatting (scoped to generated types.d.ts and clean up untracked pnpm-lock.yaml)
      - run: cd handwritten/bigquery && pnpm run fix && git checkout src/bigquery.ts system-test/ 2>/dev/null || true && rm -f pnpm-lock.yaml
      # Submit pull request
      - uses: googleapis/code-suggester@f9fef85aa02459e30e62526abe950341cbbd768b # v5
        env:
          ACCESS_TOKEN: ${{ secrets.YOSHI_CODE_BOT_TOKEN }}
        with:
          command: pr
          upstream_owner: googleapis
          upstream_repo: google-cloud-node
          description: 'Automated pull-request to keep BigQuery Discovery types up-to-date.'
          title: 'chore(bigquery): update types from Discovery'
          message: 'chore(bigquery): update types from Discovery'
          branch: update-discovery-patch
          git_dir: '.'
          fork: true
          force: true
      - name: Create issue on failure
        if: ${{ failure() }}
        uses: googleapis/librarian/.github/actions/create-issue-on-failure@baf9b8078c5e98cb90b53088f284fb7b060e195b # main
        with:
          title: "Update Discovery Generated Types failed"
          body: "The weekly scheduled task to update Discovery Generated Types failed."
          mention: "@googleapis/cloud-sdk-nodejs-team" # Can be updated to @googleapis/bigquery-team if preferred
