permissions:
  contents: read
  issues: write # Added for creating issues on failure

on:
  schedule:
    - cron: '0 12 * * TUE'
  workflow_dispatch:
name: Update Discovery Generated Types
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: ^10.0.0

      # Install all deps, including dev dependencies.
      - run: cd handwritten/bigquery && pnpm install
      # Generate types
      - run: cd handwritten/bigquery && pnpm run types
      # Fix formatting
      - run: cd handwritten/bigquery && pnpm run fix
      # Submit pull request
      - uses: googleapis/code-suggester@f9fef85aa02459e30e62526abe950341cbbd768b # v5
        env:
          ACCESS_TOKEN: ${{ secrets.YOSHI_CODE_BOT_TOKEN }}
        with:
          command: pr
          upstream_owner: googleapis
          upstream_repo: google-cloud-node
          description: 'Automated pull-request to keep BigQuery Discovery types up-to-date.'
          title: 'chore: update types from Discovery'
          message: 'chore: update types from Discovery'
          branch: update-discovery-patch
          git_dir: 'handwritten/bigquery'
          fork: true
          force: true
      - name: Create issue on failure
        if: ${{ failure() }}
        uses: googleapis/librarian/.github/actions/create-issue-on-failure@main # zizmor: ignore[unpinned-uses]
        with:
          title: "Update Discovery Generated Types failed"
          body: "The weekly scheduled task to update Discovery Generated Types failed."
          mention: "@googleapis/cloud-sdk-nodejs-team" # Can be updated to @googleapis/bigquery-team if preferred
