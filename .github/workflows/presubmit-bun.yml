permissions:
  contents: read

on:
  pull_request:
name: presubmit-bun

env:
  JS_RUNTIME: bun
  MOCHA_PARALLEL: 'false'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shard-matrix: ${{ steps.set-matrix.outputs.shard_matrix }}
      shard-total: ${{ steps.set-matrix.outputs.shard_total }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: set-matrix
        uses: ./.github/actions/calculate-shard-matrix

  bun-units:
    needs: setup
    name: Bun (${{ matrix.bun-version }}, shard ${{ matrix.shard-index }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.4.2']
        shard-index: ${{ fromJSON(needs.setup.outputs.shard-matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up toolchain for pnpm and TypeScript compile
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install Workspace Dependencies (Frozen Lockfile)
        run: |
          if ! pnpm install --frozen-lockfile --ignore-scripts; then
            echo "::error title=PNPM Lockfile Out of Date::The pnpm-lock.yaml file is out of sync with workspace package.json dependencies."
            echo ""
            echo "===================================================================================================="
            echo "❌ PNPM Lockfile Out of Date (ERR_PNPM_OUTDATED_LOCKFILE)"
            echo ""
            echo "One or more package.json files have changed or were merged without updating pnpm-lock.yaml."
            echo ""
            echo "To resolve this failure, please update the lockfile locally and commit the result:"
            echo "    pnpm install --no-frozen-lockfile"
            echo "    git add pnpm-lock.yaml"
            echo "    git commit -m \"chore: update pnpm-lock.yaml\""
            echo "    git push"
            echo "===================================================================================================="
            echo ""
            exit 1
          fi
      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Compile Workspace (Turborepo Caching)
        run: pnpm run compile
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun --version
      - run: bash ci/run_conditional_tests.sh --strict
        name: Run unit tests with Bun
        env:
          RUN_TESTS_MODE: RUN_UNIT_TESTS
          BUILD_TYPE: presubmit
          TEST_TYPE: units
          TEST_CMD: bun --bun run
          JS_RUNTIME: bun
          MOCHA_PARALLEL: 'false'
          SHARD_TOTAL: ${{ needs.setup.outputs.shard-total }}
          SHARD_INDEX: ${{ matrix.shard-index }}
          GIT_DIFF_ARG: HEAD^1

  # Consolidate shards into a single status check for branch protection
  bun-units-status:
    name: Bun (${{ matrix.bun-version }})
    needs: bun-units
    runs-on: ubuntu-latest
    if: always()
    strategy:
      fail-fast: false
      matrix:
        bun-version: ['1.4.2']
    steps:
      - name: Check Bun shard status
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: { jobs } } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const bunVersion = '${{ matrix.bun-version }}';
            const shardJobs = jobs.filter(j => j.name.startsWith(`Bun (${bunVersion}, shard `));
            if (shardJobs.length === 0) {
              core.setFailed(`No shard jobs found for Bun ${bunVersion}`);
              return;
            }
            const failed = shardJobs.filter(j => j.conclusion !== 'success');
            if (failed.length > 0) {
              const failedLinks = failed.map(j => `- ${j.name}: ${j.html_url}`).join('\n');
              core.setFailed(`${failed.length} shards failed for Bun ${bunVersion}:\n${failedLinks}`);
            } else {
              core.info(`All shards passed for Bun ${bunVersion}`);
            }
