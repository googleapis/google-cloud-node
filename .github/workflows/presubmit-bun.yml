permissions:
  contents: read

on:
  pull_request:
name: presubmit-bun
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      shard-matrix: ${{ steps.set-matrix.outputs.shard_matrix }}
      shard-total: ${{ steps.set-matrix.outputs.shard_total }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: set-matrix
        uses: ./.github/actions/calculate-shard-matrix
  units:
    needs: setup
    name: units (Node ${{ matrix.node-version }}, Shard ${{ matrix.shard-index }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
        shard-index: ${{ fromJSON(needs.setup.outputs.shard-matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      # Node.js is required by pnpm for installing dependencies. 
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Install Workspace Dependencies (Frozen Lockfile)
        run: |
          if ! pnpm install --frozen-lockfile --ignore-scripts; then
            echo "::error title=PNPM Lockfile Out of Date::The pnpm-lock.yaml file is out of sync with workspace package.json dependencies."
            echo ""
            echo "===================================================================================================="
            echo "❌ PNPM Lockfile Out of Date (ERR_PNPM_OUTDATED_LOCKFILE)"
            echo ""
            echo "One or more package.json files have changed or were merged without updating pnpm-lock.yaml."
            echo ""
            echo "To resolve this failure, please update the lockfile locally and commit the result:"
            echo "    pnpm install --no-frozen-lockfile"
            echo "    git add pnpm-lock.yaml"
            echo "    git commit -m \"chore: update pnpm-lock.yaml\""
            echo "    git push"
            echo "===================================================================================================="
            echo ""
            exit 1
          fi
      - name: Cache Turborepo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-
      - name: Compile Workspace (Turborepo Caching)
        env:
          SHARD_TOTAL: ${{ needs.setup.outputs.shard-total }}
          SHARD_INDEX: ${{ matrix.shard-index }}
        run: |
          DIFF_ARG="HEAD^1"
          if ! git diff --quiet HEAD^1 ci; then
            echo "Changes detected in ci/; sharding workspace compilation across test shards..."
            DIFF_ARG=""
          fi
          windows_exempt_tests="core/ core/packages/ core/dev-packages/ .github/scripts/fixtures/ .github/scripts/tests/ core/packages/gapic-node-processing/ core/packages/typeless-sample-bot/ handwritten/cloud-profiler/"
          test_dirs=()
          for subdir in core containers packages handwritten .github/scripts core/packages core/dev-packages; do
            for d in $(ls -d ${subdir}/*/ 2>/dev/null); do
              if [ -s "ignore.json" ] && jq -e ".ignored[] | select(. == \"$d\")" ignore.json > /dev/null 2>&1; then
                continue
              fi
              [ -f "${d}/package.json" ] || continue
              if [ -n "${DIFF_ARG}" ]; then
                if ! git diff --quiet ${DIFF_ARG} "${d}"; then
                  if [[ "${d}" != core/packages/* && "${d}" != core/dev-packages/* ]]; then
                    test_dirs+=("${d}")
                  fi
                fi
              else
                test_dirs+=("${d}")
              fi
            done
          done
          FILTERS=("--filter=./core/**")
          for i in "${!test_dirs[@]}"; do
            if [[ -n "${SHARD_TOTAL}" && -n "${SHARD_INDEX}" ]]; then
              if (( SHARD_TOTAL > 0 && i % SHARD_TOTAL != SHARD_INDEX )); then
                continue
              fi
            fi
            pkg_dir="${test_dirs[$i]%/}"
            FILTERS+=("--filter=./${pkg_dir}...")
          done
          if [ ${#FILTERS[@]} -eq 1 ]; then
            echo "No packages to test in this shard; skipping workspace compilation."
          else
            echo "Compiling shard packages (${#FILTERS[@]} filters) and core dependencies..."
            npx turbo run compile --concurrency=4 "${FILTERS[@]}" || npx turbo run compile --concurrency=4 "${FILTERS[@]}"
          fi
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun --version
      - run: bash ci/run_conditional_tests.sh --strict
        name: Run unit tests with Bun
        env:
          RUN_TESTS_MODE: RUN_UNIT_TESTS
          BUILD_TYPE: presubmit
          TEST_TYPE: units
          TEST_CMD: bun run
          SHARD_TOTAL: ${{ needs.setup.outputs.shard-total }}
          SHARD_INDEX: ${{ matrix.shard-index }}
          GIT_DIFF_ARG: HEAD^1

  # Consolidate shards into jobs representing aggregate status to simplify branch protection requirements
  units-status:
    name: units (${{ matrix.node-version }})
    needs: units
    runs-on: ubuntu-latest
    if: always()
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check shard status
        uses: ./.github/actions/check-shard-status
        with:
          node-version: ${{ matrix.node-version }}
