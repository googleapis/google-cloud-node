permissions:
  contents: read

name: invalid_link
on:
  issues:
    types: [opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  close:
    name: close
    runs-on: ubuntu-latest
    permissions:
      issues: write # Required to comment on and close issues with invalid reproduction links
      pull-requests: write # Required to comment on and close pull requests with invalid reproduction links
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 18
      - run: npm install
        working-directory: ./.github/scripts
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const script = require('./.github/scripts/close-invalid-link.cjs')
            await script({github, context})
