permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'handwritten/storage/**'
  pull_request:
    paths:
      - 'handwritten/storage/**'
name: conformance
jobs:
  conformance-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.4.0
        with:
          node-version: 14
      - run: node --version
      - run: cd handwritten/storage && npm install
      - run: cd handwritten/storage && npm run conformance-test
