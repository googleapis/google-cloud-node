---
name: breaking-change-check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  breaking-change-check:
    name: Check for breaking changes with pnpm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          filters: |
            check:
              - 'core/**/*.ts'
              - 'core/**/package.json'
              - 'core/**/tsconfig*.json'
              - 'handwritten/**/*.ts'
              - 'handwritten/**/package.json'
              - 'handwritten/**/tsconfig*.json'
              - '.github/workflows/breaking-change-check.yaml'
            self:
              - 'core/test-utils/**'
              - '.github/workflows/breaking-change-check.yaml'
      - name: Use Node.js 24
        if: steps.changes.outputs.check == 'true' || steps.changes.outputs.self == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: ./.github/actions/pnpm-lockfile-check
        if: steps.changes.outputs.check == 'true' || steps.changes.outputs.self == 'true' || github.event_name == 'workflow_dispatch'
      - name: Compile affected packages and workspace dependents via pnpm
        if: steps.changes.outputs.check == 'true' || steps.changes.outputs.self == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          BASE_SHA=$(git merge-base HEAD^1 HEAD 2>/dev/null || git rev-parse HEAD^1)
          pnpm --filter "...[${BASE_SHA}...HEAD]..." --filter "!./packages/*" --if-present run compile
      - name: Run breaking-change-check unit and harness tests
        if: steps.changes.outputs.self == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pnpm --dir core/test-utils exec jest test/breaking-change-check.test.ts
      - name: Check public TypeScript interfaces with core/test-utils
        if: steps.changes.outputs.check == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          BREAKING_CHANGE_BASE_REF: ${{ github.event_name == 'workflow_dispatch' && 'HEAD^1' || '' }}
        run: |
          pnpm --dir core/test-utils run check
