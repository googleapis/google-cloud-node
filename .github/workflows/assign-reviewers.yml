name: Auto Assign Reviewers

on:
  # pull_request_target is required to grant write permissions for reviewer assignment on fork PRs.
  # The workflow only runs github-script and does not check out or execute untrusted code.
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Assign Reviewers
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          STRICT: "true"
          GIT_DIFF_ARG: "HEAD^1"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const pull_number = pr.number;
            const author = pr.user.login;

            const DEFAULT_TEAM = 'cloud-sdk-nodejs-team';
            const FALLBACK_TEAM = ['westarle', 'feywind', 'danieljbruce', 'shivanee-p'];

            const hasTeam = (teams, slug) =>
              (teams || []).some(t => (t.slug || t.name || '').toLowerCase() === slug.toLowerCase());

            const requestReviewers = (reviewers = [], team_reviewers = []) => {
              const payload = { owner, repo, pull_number };
              if (reviewers.length > 0) payload.reviewers = reviewers;
              if (team_reviewers.length > 0) payload.team_reviewers = team_reviewers;
              return github.rest.pulls.requestReviewers(payload);
            };

            const removeDefaultTeamIfRequested = async () => {
              if (hasTeam(pr.requested_teams, DEFAULT_TEAM)) {
                console.log(`Removing default team (${DEFAULT_TEAM})...`);
                try {
                  await github.rest.pulls.removeRequestedReviewers({
                    owner,
                    repo,
                    pull_number,
                    team_reviewers: [DEFAULT_TEAM]
                  });
                  console.log(`Successfully removed default team (${DEFAULT_TEAM}).`);
                } catch (err) {
                  console.warn(`Failed to remove default team (${DEFAULT_TEAM}):`, err.message || err);
                }
              }
            };

            // 1. Release PRs route directly to default team
            if (['release-please[bot]', 'release-please'].includes(author)) {
              if (!hasTeam(pr.requested_teams, DEFAULT_TEAM)) {
                try {
                  await requestReviewers([], [DEFAULT_TEAM]);
                } catch (err) {
                  console.error(`Failed to assign ${DEFAULT_TEAM}:`, err.message || err);
                }
              }
              return;
            }

            // 2. Skip auto-assignment if reviewers or route-specific team are already requested
            const hasRouteTeam = (pr.requested_teams || []).some(t => (t.slug || t.name || '').toLowerCase() !== DEFAULT_TEAM);
            const hasRequestedReviewers = (pr.requested_reviewers || []).length > 0;

            if (hasRequestedReviewers || hasRouteTeam) {
              console.log("PR already has reviewers assigned; ensuring default team is removed if needed...");
              await removeDefaultTeamIfRequested();
              console.log("Skipping auto-assignment.");
              return;
            }

            // 3. Obtain changed files (via local git diff or API fallback)
            const getChangedFiles = async () => {
              const isStrict = Boolean(process.env.STRICT);
              if (isStrict) {
                const gitDiffArg = process.env.GIT_DIFF_ARG;
                if (!gitDiffArg) {
                  throw new Error(
                    'Strict mode is enabled, but GIT_DIFF_ARG environment variable was not provided.'
                  );
                }
                try {
                  cp.execSync(`git diff --quiet ${gitDiffArg}`);
                } catch (err) {
                  if (err.status !== 1) {
                    throw new Error(
                      `Strict mode error: git diff --quiet ${gitDiffArg} failed with exit code ${err.status}.\n` +
                      `Details: ${String(err.stderr || err.message || '').trim()}`
                    );
                  }
                }
                const diffOutput = cp.execSync(`git diff --name-only --diff-filter=ACMRT ${gitDiffArg}`, { encoding: 'utf-8' });
                console.log(`Strict mode enabled. Comparing using GIT_DIFF_ARG: ${gitDiffArg}`);
                return diffOutput.split('\n').map(f => f.trim()).filter(Boolean);
              }

              const baseRef = pr.base.ref || 'main';
              const refsToTry = baseRef.startsWith('origin/') ? [baseRef] : [`origin/${baseRef}`, baseRef];

              for (const ref of refsToTry) {
                try {
                  const diffOutput = cp.execSync(`git diff --name-only --diff-filter=ACMRT ${ref}...HEAD`, { encoding: 'utf-8' });
                  console.log(`Comparing against base reference: ${ref}`);
                  return diffOutput.split('\n').map(f => f.trim()).filter(Boolean);
                } catch (err) {
                  console.warn(`Could not get files from git diff against ${ref}:`, err.message || err);
                }
              }

              try {
                console.log("Falling back to GitHub REST API to list PR files...");
                const res = await github.rest.pulls.listFiles({ owner, repo, pull_number, per_page: 100 });
                return res.data.map(f => f.filename);
              } catch (apiErr) {
                console.error("Failed to list PR files via API:", apiErr.message || apiErr);
                return [];
              }
            };

            const files = await getChangedFiles();

            const PATH_ROUTING = [
              { prefix: 'handwritten/bigquery/', team: 'bigquery-team' },
              { prefix: 'handwritten/cloud-profiler/', team: 'cloud-profiler-team' },
              { prefix: 'handwritten/storage/', team: 'gcs-team' },
              { prefix: 'handwritten/firestore/', team: 'firestore-team' },
              { prefix: 'handwritten/spanner/', team: 'spanner-team' },
              { prefix: 'handwritten/spanner-driver/', team: 'spanner-team' },
              { prefix: 'handwritten/bigquery-storage/', team: 'bigquery-team' },
              { prefix: 'core/packages/google-auth-library-nodejs/', team: 'aion-team' }
            ];

            const matchedTeams = [...new Set(
              PATH_ROUTING
                .filter(route => files.some(file => file.startsWith(route.prefix)))
                .map(route => route.team)
            )];

            let assigned = false;

            // 4. Request review from route-specific teams if applicable
            if (matchedTeams.length > 0) {
              console.log(`Requesting review from route teams: ${matchedTeams.join(', ')}`);
              try {
                await requestReviewers([], matchedTeams);
                assigned = true;
              } catch (err) {
                console.error(`Failed to assign team reviewers (${matchedTeams.join(', ')}):`, err.message || err);
              }
            }

            // 5. Fallback to deterministic default reviewer assignment from local CODEOWNERS
            if (!assigned) {
              const getDefaultReviewers = () => {
                try {
                  if (fs.existsSync('.github/CODEOWNERS')) {
                    const line = fs.readFileSync('.github/CODEOWNERS', 'utf-8')
                      .split('\n')
                      .map(l => l.trim())
                      .find(l => l.startsWith('#') && l.includes('team_members:'));
                    if (line) {
                      const members = line.split('team_members:')[1].trim().split(/\s+/)
                        .filter(p => p.startsWith('@')).map(p => p.substring(1))
                        .filter(login => login.toLowerCase() !== author.toLowerCase());
                      if (members.length > 0) return members;
                    }
                  }
                } catch (err) {
                  console.error("Failed to read CODEOWNERS:", err.message || err);
                }
                return FALLBACK_TEAM.filter(login => login.toLowerCase() !== author.toLowerCase());
              };

              const defaultReviewers = getDefaultReviewers();

              if (defaultReviewers.length > 0) {
                const selectedIndex = pull_number % defaultReviewers.length;
                const candidateQueue = [
                  defaultReviewers[selectedIndex],
                  ...defaultReviewers.filter((_, i) => i !== selectedIndex)
                ];

                for (const candidate of candidateQueue) {
                  console.log(`Attempting to assign reviewer: ${candidate}`);
                  try {
                    await requestReviewers([candidate]);
                    assigned = true;
                    console.log(`Successfully assigned reviewer: ${candidate}`);
                    break;
                  } catch (reqErr) {
                    console.error(`Failed to assign ${candidate}:`, reqErr.message || reqErr);
                  }
                }
              } else {
                console.warn("No default reviewers available.");
              }
            }

            // 6. Remove default team if an individual or specific route reviewer was assigned
            if (assigned) {
              await removeDefaultTeamIfRequested();
            }
