name: Auto Assign Reviewers

on:
  # pull_request_target is required to grant write permissions for reviewer assignment on fork PRs.
  # The workflow only runs github-script and does not check out or execute untrusted code.
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Assign Reviewers
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const author = context.payload.pull_request.user.login;

            const DEFAULT_TEAM = 'cloud-sdk-nodejs-team';
            const FALLBACK_TEAM = ['westarle', 'feywind', 'danieljbruce', 'shivanee-p'];

            const hasTeam = (teams, slug) =>
              teams.some(t => (t.slug || t.name || '').toLowerCase() === slug.toLowerCase());

            const requestReviewers = (reviewers = [], team_reviewers = []) =>
              github.rest.pulls.requestReviewers({ owner, repo, pull_number, reviewers, team_reviewers });

            const removeTeamReviewer = (team) =>
              github.rest.pulls.removeRequestedReviewers({ owner, repo, pull_number, reviewers: [], team_reviewers: [team] });

            // 1. Release PRs route directly to default team
            if (['release-please[bot]', 'release-please'].includes(author)) {
              const requestedTeams = context.payload.pull_request.requested_teams || [];
              if (!hasTeam(requestedTeams, DEFAULT_TEAM)) {
                try {
                  await requestReviewers([], [DEFAULT_TEAM]);
                } catch (err) {
                  console.error(`Failed to assign ${DEFAULT_TEAM}:`, err.message || err);
                }
              }
              return;
            }

            // 2. Check if PR already has reviewers, route-specific team, or reviews
            const requestedReviewers = context.payload.pull_request.requested_reviewers || [];
            const requestedTeams = context.payload.pull_request.requested_teams || [];
            const hasDefaultTeam = hasTeam(requestedTeams, DEFAULT_TEAM);
            const hasRouteTeam = requestedTeams.some(t => (t.slug || t.name || '').toLowerCase() !== DEFAULT_TEAM);

            let hasReviews = false;
            try {
              const { data: reviews } = await github.rest.pulls.listReviews({ owner, repo, pull_number });
              hasReviews = reviews.length > 0;
            } catch (err) {
              console.warn("Failed to check PR reviews:", err.message || err);
            }

            if (requestedReviewers.length > 0 || hasRouteTeam || hasReviews) {
              if (hasDefaultTeam) {
                console.log("PR already has reviewers/reviews; removing default team...");
                try { await removeTeamReviewer(DEFAULT_TEAM); } catch (err) {
                  console.warn(`Failed to remove ${DEFAULT_TEAM}:`, err.message || err);
                }
              }
              console.log("Skipping auto-assignment.");
              return;
            }

            // 3. Match modified files against path routing
            let files = [];
            try {
              const res = await github.rest.pulls.listFiles({ owner, repo, pull_number, per_page: 100 });
              files = res.data;
            } catch (err) {
              console.error("Failed to list PR files:", err.message || err);
            }

            const PATH_ROUTING = [
              { prefix: 'handwritten/bigquery/', team: 'bigquery-team' },
              { prefix: 'handwritten/cloud-profiler/', team: 'cloud-profiler-team' },
              { prefix: 'handwritten/storage/', team: 'gcs-team' },
              { prefix: 'handwritten/firestore/', team: 'firestore-team' },
              { prefix: 'handwritten/spanner/', team: 'spanner-team' },
              { prefix: 'handwritten/spanner-driver/', team: 'spanner-team' },
              { prefix: 'handwritten/bigquery-storage/', team: 'bigquery-team' },
              { prefix: 'core/packages/google-auth-library-nodejs/', team: 'aion-team' }
            ];

            const matchedTeams = [...new Set(
              PATH_ROUTING
                .filter(route => files.some(f => f.filename.startsWith(route.prefix)))
                .map(route => route.team)
            )];

            let assigned = false;
            if (matchedTeams.length > 0) {
              console.log(`Requesting review from route teams: ${matchedTeams.join(', ')}`);
              try {
                await requestReviewers([], matchedTeams);
                assigned = true;
              } catch (err) {
                console.error(`Failed to assign team reviewers (${matchedTeams.join(', ')}):`, err.message || err);
              }
            }

            // 4. Default reviewer assignment with load balancing if no route team was assigned
            if (!assigned) {
              function getDefaultReviewers() {
                try {
                  if (fs.existsSync('.github/CODEOWNERS')) {
                    const line = fs.readFileSync('.github/CODEOWNERS', 'utf-8')
                      .split('\n')
                      .map(l => l.trim())
                      .find(l => l.startsWith('#') && l.includes('team_members:'));
                    if (line) {
                      const members = line.split('team_members:')[1].trim().split(/\s+/)
                        .filter(p => p.startsWith('@')).map(p => p.substring(1))
                        .filter(login => login.toLowerCase() !== author.toLowerCase());
                      if (members.length > 0) return members;
                    }
                  }
                } catch (err) {
                  console.error("Failed to read CODEOWNERS:", err.message || err);
                }
                return FALLBACK_TEAM.filter(login => login.toLowerCase() !== author.toLowerCase());
              }

              const defaultReviewers = getDefaultReviewers();

              if (defaultReviewers.length > 0) {
                let candidateQueue = [...defaultReviewers].sort(() => Math.random() - 0.5);
                try {
                  const { data: openPRs } = await github.rest.pulls.list({ owner, repo, state: 'open', per_page: 100 });
                  const loadMap = Object.fromEntries(defaultReviewers.map(m => [m.toLowerCase(), 0]));

                  for (const pr of openPRs) {
                    for (const user of [...(pr.requested_reviewers || []), ...(pr.assignees || [])]) {
                      const lower = (user.login || '').toLowerCase();
                      if (lower in loadMap) loadMap[lower]++;
                    }
                  }
                  console.log("Current team workload:", loadMap);

                  const minLoad = Math.min(...Object.values(loadMap));
                  const leastLoaded = defaultReviewers.filter(m => loadMap[m.toLowerCase()] === minLoad);
                  const remaining = defaultReviewers.filter(m => loadMap[m.toLowerCase()] > minLoad);

                  candidateQueue = [
                    ...leastLoaded.sort(() => Math.random() - 0.5),
                    ...remaining.sort(() => Math.random() - 0.5)
                  ];
                } catch (err) {
                  console.error("Failed to calculate workload, proceeding with default list:", err.message || err);
                }

                for (const candidate of candidateQueue) {
                  console.log(`Attempting to assign reviewer: ${candidate}`);
                  try {
                    await requestReviewers([candidate]);
                    assigned = true;
                    console.log(`Successfully assigned reviewer: ${candidate}`);
                    break;
                  } catch (reqErr) {
                    console.error(`Failed to assign ${candidate}:`, reqErr.message || reqErr);
                  }
                }
              } else {
                console.warn("No default reviewers available.");
              }
            }

            // 5. Remove default team if an individual or specific route reviewer was assigned
            if (assigned) {
              try {
                await removeTeamReviewer(DEFAULT_TEAM);
              } catch (err) {
                console.warn(`Failed to remove default ${DEFAULT_TEAM}:`, err.message || err);
              }
            }
