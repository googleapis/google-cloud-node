name: Auto Assign Reviewers

on:
  # pull_request_target is required to grant write permissions for reviewer assignment on fork PRs.
  # The workflow only runs github-script and does not check out or execute untrusted code.
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Assign Reviewers
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.pull_request.user.login;

            // Release PRs should remain the responsibility of the oncall,
            // so we route them only to the default team rather than individual team members.
            if (author === 'release-please[bot]' || author === 'release-please') {
              console.log(`PR opened by ${author}. Ensuring cloud-sdk-nodejs-team is assigned as a reviewer.`);
              const requestedTeams = context.payload.pull_request.requested_teams || [];
              const hasDefaultTeam = requestedTeams.some(team =>
                (team.slug && team.slug.toLowerCase() === 'cloud-sdk-nodejs-team') ||
                (team.name && team.name.toLowerCase() === 'cloud-sdk-nodejs-team')
              );
              if (!hasDefaultTeam) {
                try {
                  await github.rest.pulls.requestReviewers({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.pull_request.number,
                    team_reviewers: ['cloud-sdk-nodejs-team'],
                  });
                } catch (err) {
                  console.error("Failed to assign default cloud-sdk-nodejs-team reviewer:", err.message || err);
                }
              }
              return;
            }

            const requestedReviewers = context.payload.pull_request.requested_reviewers || [];
            const requestedTeams = context.payload.pull_request.requested_teams || [];

            const hasDefaultTeam = requestedTeams.some(team =>
              (team.slug && team.slug.toLowerCase() === 'cloud-sdk-nodejs-team') ||
              (team.name && team.name.toLowerCase() === 'cloud-sdk-nodejs-team')
            );
            const hasRouteSpecificTeam = requestedTeams.some(team =>
              (team.slug && team.slug.toLowerCase() !== 'cloud-sdk-nodejs-team') &&
              (!team.name || team.name.toLowerCase() !== 'cloud-sdk-nodejs-team')
            );

            // Check if PR has already been reviewed
            let hasReviews = false;
            try {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              if (reviews.length > 0) {
                console.log("PR already has reviews.");
                hasReviews = true;
              }
            } catch (err) {
              console.warn("Failed to check PR reviews:", err.message || err);
            }

            let shouldExit = false;
            if (requestedReviewers.length > 0) {
              console.log(`PR already has requested reviewers: ${requestedReviewers.map(r => r.login).join(', ')}.`);
              shouldExit = true;
            } else if (hasRouteSpecificTeam) {
              console.log(`PR already has route-specific team reviewer requested: ${requestedTeams.map(t => t.slug || t.name).join(', ')}.`);
              shouldExit = true;
            } else if (hasReviews) {
              shouldExit = true;
            }

            if (shouldExit) {
              if (hasDefaultTeam) {
                console.log("PR already has individual, route-specific reviewers, or reviews, but default cloud-sdk-nodejs-team is still requested. Removing it...");
                try {
                  await github.rest.pulls.removeRequestedReviewers({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.pull_request.number,
                    reviewers: [],
                    team_reviewers: ['cloud-sdk-nodejs-team'],
                  });
                } catch (err) {
                  console.warn("Failed to remove default cloud-sdk-nodejs-team reviewer:", err.message || err);
                }
              }
              console.log("Skipping auto-assignment.");
              return;
            }


            // 2. Get list of files modified in the PR
            let files = [];
            try {
              const res = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                per_page: 100,
              });
              files = res.data;
            } catch (err) {
              console.error("Failed to list PR files:", err.message || err);
            }

            const PATH_ROUTING = [
              { prefix: 'handwritten/bigquery/', team: 'bigquery-team' },
              { prefix: 'handwritten/cloud-profiler/', team: 'cloud-profiler-team' },
              { prefix: 'handwritten/storage/', team: 'gcs-team' },
              { prefix: 'handwritten/firestore/', team: 'firestore-team' },
              { prefix: 'handwritten/spanner/', team: 'spanner-team' },
              { prefix: 'handwritten/spanner-driver/', team: 'spanner-team' },
              { prefix: 'handwritten/bigquery-storage/', team: 'bigquery-team' },
              { prefix: 'core/packages/google-auth-library-nodejs/', team: 'aion-team' }
            ];

            const assignedTeams = new Set();
            for (const route of PATH_ROUTING) {
              if (files.some(file => file.filename.startsWith(route.prefix))) {
                assignedTeams.add(route.team);
              }
            }

            let assigned = false;
            if (assignedTeams.size > 0) {
              const teamReviewers = Array.from(assignedTeams);
              console.log(`PR contains changes matching specific routes. Requesting review from: ${teamReviewers.join(', ')}`);
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  team_reviewers: teamReviewers,
                });
                assigned = true;
              } catch (err) {
                console.error(`Failed to assign route-specific team reviewers (${teamReviewers.join(', ')}):`, err.message || err);
                console.log("Falling back to default team members.");
              }
            }

            if (!assigned) {
              const baseRef = context.payload.pull_request.base.ref || context.payload.pull_request.base.sha || 'main';
              console.log(`Fetching .github/CODEOWNERS (ref: ${baseRef}) to identify default reviewers...`);
              let defaultReviewers = [];
              try {
                const { data: codeownersData } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: '.github/CODEOWNERS',
                  ref: baseRef,
                });
                const content = Buffer.from(codeownersData.content, 'base64').toString('utf-8');
                const lines = content.split('\n');
                for (const line of lines) {
                  const trimmed = line.trim();
                  if (trimmed.startsWith('#')) {
                    const commentContent = trimmed.substring(1).trim();
                    if (commentContent.startsWith('team_members:')) {
                      const listPart = commentContent.substring('team_members:'.length).trim();
                      const parts = listPart.split(/\s+/);
                      defaultReviewers = parts
                        .filter(p => p.startsWith('@'))
                        .map(p => p.substring(1))
                        .filter(login => login.toLowerCase() !== author.toLowerCase());
                      break;
                    }
                  }
                }
              } catch (err) {
                console.error("Failed to read or parse CODEOWNERS:", err.message || err);
              }

              // Hardcoded fallback list if CODEOWNERS could not be fetched or contained no reviewers (excluding author)
              if (defaultReviewers.length === 0) {
                console.warn("No default reviewers found in CODEOWNERS. Using fallback team members.");
                const FALLBACK_TEAM = ['pearigee', 'feywind', 'danieljbruce', 'shivanee-p'];
                defaultReviewers = FALLBACK_TEAM.filter(login => login.toLowerCase() !== author.toLowerCase());
              }

              if (defaultReviewers.length > 0) {
                console.log(`Found default reviewers: ${defaultReviewers.join(', ')}. Load balancing among them.`);
                let candidateLogins = defaultReviewers;
                let minLoad = 0;

                try {
                  // Retrieve active open PRs to calculate load
                  const { data: openPRs } = await github.rest.pulls.list({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: 'open',
                    per_page: 100,
                  });

                  const loadMap = {};
                  for (const member of defaultReviewers) {
                    loadMap[member.toLowerCase()] = 0;
                  }

                  for (const pr of openPRs) {
                    // Count pending review requests
                    if (pr.requested_reviewers) {
                      for (const reviewer of pr.requested_reviewers) {
                        const lower = (reviewer.login || '').toLowerCase();
                        if (loadMap[lower] !== undefined) {
                          loadMap[lower]++;
                        }
                      }
                    }
                    // Count assignees
                    if (pr.assignees) {
                      for (const assignee of pr.assignees) {
                        const lower = (assignee.login || '').toLowerCase();
                        if (loadMap[lower] !== undefined) {
                          loadMap[lower]++;
                        }
                      }
                    }
                  }

                  console.log("Current team workload:", loadMap);

                  // Find members with the minimum load
                  minLoad = Infinity;
                  candidateLogins = [];
                  for (const member of defaultReviewers) {
                    const load = loadMap[member.toLowerCase()];
                    if (load < minLoad) {
                      minLoad = load;
                      candidateLogins = [member];
                    } else if (load === minLoad) {
                      candidateLogins.push(member);
                    }
                  }
                } catch (err) {
                  console.error("Failed to calculate workload from open PRs, proceeding with all default reviewers:", err.message || err);
                }

                // Shuffle candidates and attempt to request review from least loaded candidates first, then any default reviewer
                const candidateQueue = [
                  ...candidateLogins.sort(() => Math.random() - 0.5),
                  ...defaultReviewers.filter(m => !candidateLogins.includes(m)).sort(() => Math.random() - 0.5)
                ];

                for (const candidate of candidateQueue) {
                  console.log(`Attempting to assign reviewer: ${candidate}`);
                  try {
                    await github.rest.pulls.requestReviewers({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      pull_number: context.payload.pull_request.number,
                      reviewers: [candidate],
                    });
                    assigned = true;
                    console.log(`Successfully assigned reviewer: ${candidate}`);
                    break;
                  } catch (reqErr) {
                    console.error(`Failed to assign reviewer ${candidate}:`, reqErr.message || reqErr);
                  }
                }
              } else {
                console.warn("No default reviewers available to assign.");
              }
            }

            if (assigned) {
              console.log("Removing default cloud-sdk-nodejs-team reviewer...");
              try {
                await github.rest.pulls.removeRequestedReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  reviewers: [],
                  team_reviewers: ['cloud-sdk-nodejs-team'],
                });
              } catch (err) {
                console.warn("Failed to remove default cloud-sdk-nodejs-team reviewer:", err.message || err);
              }
            }

