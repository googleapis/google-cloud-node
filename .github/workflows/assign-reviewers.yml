name: Auto Assign Reviewers

on:
  # pull_request_target is required to grant write permissions for reviewer assignment on fork PRs.
  # The workflow only runs github-script and does not check out or execute untrusted code.
  # zizmor: ignore[dangerous-triggers]
  pull_request_target:
    types: [opened, ready_for_review, reopened, synchronize, review_requested, assigned]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  assign-reviewers:
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.draft == false &&
      !(github.event.action == 'review_requested' && github.actor == 'github-actions[bot]')
    steps:
      - name: Assign Reviewers
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.pull_request.user.login;

            // Fetch all files modified in the PR across all pages
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });

            // Read and parse .github/CODEOWNERS from the base branch as the single source of truth
            // for both default team_members and file-to-team ownership rules.
            let defaultReviewers = [];
            const codeownersRules = [];
            try {
              const { data: codeownersData } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.github/CODEOWNERS',
                ref: context.payload.pull_request.base.sha,
              });
              const content = Buffer.from(codeownersData.content, 'base64').toString('utf-8');
              const lines = content.split('\n');
              for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed) continue;
                if (trimmed.startsWith('#')) {
                  const commentContent = trimmed.substring(1).trim();
                  if (commentContent.startsWith('team_members:')) {
                    const listPart = commentContent.substring('team_members:'.length).trim();
                    const parts = listPart.split(/\s+/);
                    defaultReviewers = parts
                      .filter(p => p.startsWith('@'))
                      .map(p => p.substring(1))
                      .filter(login => login !== author);
                  }
                  continue;
                }
                const ruleLine = trimmed.split('#')[0].trim();
                const parts = ruleLine.split(/\s+/);
                if (parts.length >= 2) {
                  const pattern = parts[0];
                  const teams = parts
                    .slice(1)
                    .filter(p => p.startsWith('@'))
                    .map(p => p.replace(/^@[^/]+\//, ''));
                  if (teams.length > 0) {
                    codeownersRules.push({ pattern, teams });
                  }
                }
              }
            } catch (err) {
              console.error("Failed to read or parse CODEOWNERS:", err);
            }

            const matchesCodeownersPattern = (filename, pattern) => {
              if (pattern === '*') return true;
              const normalized = pattern.startsWith('/') ? pattern.slice(1) : pattern;
              if (normalized.endsWith('/')) {
                return filename.startsWith(normalized);
              }
              return filename === normalized || filename.startsWith(normalized + '/');
            };

            const SHARED_PARTNER_FILES = new Set([
              'pnpm-lock.yaml',
              '.release-please-manifest.json',
              'release-please-config.json',
              'release-please-submodules.json',
              'changelog.json',
            ]);

            // Determine requestedTeams and partner team routing from CODEOWNERS rules
            // (in CODEOWNERS, the last matching pattern for each file takes precedence).
            const requestedTeamSet = new Set();
            const assignedTeams = new Set();
            let allowSharedPartnerFiles = false;
            const unownedByPartnerFiles = [];

            for (const file of files) {
              let matchedRule = null;
              for (const rule of codeownersRules) {
                if (matchesCodeownersPattern(file.filename, rule.pattern)) {
                  matchedRule = rule;
                }
              }
              const fileTeams = matchedRule ? matchedRule.teams : ['cloud-sdk-nodejs-team'];
              for (const team of fileTeams) {
                requestedTeamSet.add(team);
              }
              const partnerTeamsForFile = fileTeams.filter(t => t !== 'cloud-sdk-nodejs-team');
              if (partnerTeamsForFile.length > 0) {
                for (const pt of partnerTeamsForFile) {
                  assignedTeams.add(pt);
                }
                const normalizedPattern = matchedRule.pattern.startsWith('/')
                  ? matchedRule.pattern.slice(1)
                  : matchedRule.pattern;
                if (
                  normalizedPattern.startsWith('handwritten/') ||
                  normalizedPattern.startsWith('.github/workflows/')
                ) {
                  allowSharedPartnerFiles = true;
                }
              } else {
                unownedByPartnerFiles.push(file.filename);
              }
            }

            const requestedTeams = Array.from(requestedTeamSet);
            const hasNonPartnerFiles = unownedByPartnerFiles.some(
              filename => !(allowSharedPartnerFiles && SHARED_PARTNER_FILES.has(filename))
            );
            const requiresDefaultTeamReview = assignedTeams.size === 0 || hasNonPartnerFiles;

            // Release PRs remain with the CODEOWNERS teams (cloud-sdk-nodejs-team and any matched partner teams)
            // rather than assigning individual team members.
            if (author === 'release-please[bot]' || author === 'release-please') {
              console.log(`PR opened by ${author}. Keeping CODEOWNERS team reviewers: ${requestedTeams.join(', ')}.`);
              return;
            }

            // Fetch live requested reviewers and assignees in case they were updated after webhook event creation
            let requestedReviewers = context.payload.pull_request.requested_reviewers || [];
            let assignees = context.payload.pull_request.assignees || [];
            try {
              const { data: livePR } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              if (livePR.requested_reviewers) {
                requestedReviewers = livePR.requested_reviewers;
              }
              if (livePR.assignees) {
                assignees = livePR.assignees;
              }
            } catch (err) {
              console.warn("Failed to fetch live PR details:", err.message || err);
            }
            try {
              const { data: liveReviewers } = await github.rest.pulls.listRequestedReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              if (liveReviewers.users) {
                requestedReviewers = liveReviewers.users;
              }
            } catch (err) {
              console.warn("Failed to fetch live requested reviewers:", err.message || err);
            }
            if (
              context.payload.requested_reviewer &&
              context.payload.requested_reviewer.login &&
              !requestedReviewers.some(r => r.login === context.payload.requested_reviewer.login)
            ) {
              requestedReviewers.push(context.payload.requested_reviewer);
            }

            const KNOWN_BOTS = new Set([
              'gcf-owl-bot[bot]',
              'gcf-owl-bot',
              'release-please[bot]',
              'release-please',
              'dependabot[bot]',
              'dependabot',
              'renovate-bot',
              'renovate',
              'yoshi-code-bot',
              'gemini-code-assist[bot]',
              'gemini-code-assist',
              'google-cla[bot]',
              'google-cla',
              'github-actions[bot]',
              'github-actions',
            ]);

            const isBot = (user) => {
              if (!user) return false;
              if (user.type === 'Bot') return true;
              if (user.login && user.login.endsWith('[bot]')) return true;
              if (user.login && KNOWN_BOTS.has(user.login)) return true;
              return false;
            };

            const humanRequestedReviewers = requestedReviewers.filter(
              r => !isBot(r) && r.login !== author
            );
            const humanAssignees = assignees.filter(
              a => !isBot(a) && a.login !== author
            );
            if (humanRequestedReviewers.length > 0) {
              console.log(`PR already has requested reviewers: ${humanRequestedReviewers.map(r => r.login).join(', ')}.`);
            }
            if (humanAssignees.length > 0) {
              console.log(`PR already has assignees: ${humanAssignees.map(a => a.login).join(', ')}.`);
            }

            const hasDefaultTeam = requestedTeams.includes('cloud-sdk-nodejs-team');
            const hasAllAssignedTeams =
              assignedTeams.size > 0 &&
              Array.from(assignedTeams).every(slug => requestedTeams.includes(slug));

            // Check if PR has already been reviewed by human reviewers (excluding bots and author)
            let hasReviews = false;
            let humanReviews = [];
            try {
              const { data: reviews } = await github.rest.pulls.listReviews({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              humanReviews = reviews.filter(review => {
                if (!review.user) return false;
                if (isBot(review.user)) return false;
                if (review.user.login === author) return false;
                return true;
              });
              if (humanReviews.length > 0) {
                console.log(`PR already has reviews from: ${humanReviews.map(r => r.user.login).join(', ')}.`);
                hasReviews = true;
              }
            } catch (err) {
              console.warn("Failed to check PR reviews:", err.message || err);
            }

            const defaultReviewerSet = new Set(defaultReviewers);
            const hasDefaultTeamMemberReviewer = humanRequestedReviewers.some(r => defaultReviewerSet.has(r.login));
            const hasDefaultTeamMemberAssignee = humanAssignees.some(a => defaultReviewerSet.has(a.login));
            const hasDefaultTeamMemberReview = humanReviews.some(r => defaultReviewerSet.has(r.user.login));
            const hasDefaultTeamMember =
              hasDefaultTeamMemberReviewer ||
              hasDefaultTeamMemberAssignee ||
              hasDefaultTeamMemberReview;

            const partnerReviewSatisfied =
              assignedTeams.size === 0 ||
              hasAllAssignedTeams ||
              humanRequestedReviewers.length > 0 ||
              humanAssignees.length > 0 ||
              hasReviews;
            const defaultTeamReviewSatisfied =
              !requiresDefaultTeamReview ||
              hasDefaultTeamMember ||
              (defaultReviewers.length === 0 && (humanRequestedReviewers.length > 0 || humanAssignees.length > 0 || hasReviews));

            const shouldExit =
              partnerReviewSatisfied &&
              defaultTeamReviewSatisfied &&
              (hasDefaultTeamMember || hasAllAssignedTeams || (!requiresDefaultTeamReview && (humanRequestedReviewers.length > 0 || humanAssignees.length > 0 || hasReviews)));

            if (shouldExit) {
              if (hasDefaultTeam) {
                console.log("PR already has sufficient reviewers/assignees/reviews, but default cloud-sdk-nodejs-team is requested. Removing it...");
                try {
                  await github.rest.pulls.removeRequestedReviewers({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.pull_request.number,
                    reviewers: [],
                    team_reviewers: ['cloud-sdk-nodejs-team'],
                  });
                } catch (err) {
                  console.warn("Failed to remove default cloud-sdk-nodejs-team reviewer:", err.message || err);
                }
              }
              console.log("Skipping auto-assignment.");
              return;
            }

            let assigned =
              (hasAllAssignedTeams && !requiresDefaultTeamReview) ||
              (requiresDefaultTeamReview && hasDefaultTeamMember);
            if (!assigned) {
              if (defaultReviewers.length > 0) {
                console.log(`Found default reviewers: ${defaultReviewers.join(', ')}. Load balancing among them.`);
                try {
                  // Retrieve active open PRs to calculate load
                  const { data: openPRs } = await github.rest.pulls.list({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: 'open',
                    per_page: 100,
                  });

                  const loadMap = {};
                  for (const member of defaultReviewers) {
                    loadMap[member] = 0;
                  }

                  for (const pr of openPRs) {
                    // Count pending review requests
                    if (pr.requested_reviewers) {
                      for (const reviewer of pr.requested_reviewers) {
                        if (loadMap[reviewer.login] !== undefined) {
                          loadMap[reviewer.login]++;
                        }
                      }
                    }
                    // Count assignees
                    if (pr.assignees) {
                      for (const assignee of pr.assignees) {
                        if (loadMap[assignee.login] !== undefined) {
                          loadMap[assignee.login]++;
                        }
                      }
                    }
                  }

                  console.log("Current team workload:", loadMap);

                  // Find members with the minimum load
                  let minLoad = Infinity;
                  let selectedReviewers = [];
                  for (const member of defaultReviewers) {
                    const load = loadMap[member];
                    if (load < minLoad) {
                      minLoad = load;
                      selectedReviewers = [member];
                    } else if (load === minLoad) {
                      selectedReviewers.push(member);
                    }
                  }

                  const leastLoadedReviewer = selectedReviewers[Math.floor(Math.random() * selectedReviewers.length)];
                  console.log(`Selected reviewer with least load (load: ${minLoad}): ${leastLoadedReviewer}`);

                  await github.rest.pulls.requestReviewers({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.payload.pull_request.number,
                    reviewers: [leastLoadedReviewer],
                  });
                  assigned = true;
                } catch (err) {
                  console.error("Failed to assign reviewers using load balancing:", err);
                }
              } else {
                console.warn("No default reviewers found in CODEOWNERS (or they only contained teams/author).");
              }
            }

            if (assigned && hasDefaultTeam) {
              console.log("Removing default cloud-sdk-nodejs-team reviewer...");
              try {
                await github.rest.pulls.removeRequestedReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  reviewers: [],
                  team_reviewers: ['cloud-sdk-nodejs-team'],
                });
              } catch (err) {
                console.warn("Failed to remove default cloud-sdk-nodejs-team reviewer:", err.message || err);
              }
            }
