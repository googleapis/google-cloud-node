[package]
name = "spanner-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Rust native extension for Node.js Spanner throughput POC"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["async", "napi4"] }
napi-derive = "2"
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
once_cell = "1"

[build-dependencies]
napi-build = "2"
tonic-build = "0.12"
