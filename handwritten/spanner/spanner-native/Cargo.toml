[workspace]
members = ["spanner-core"]

[package]
name = "spanner-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["async", "napi4"] }
napi-derive = "2"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
once_cell = "1"
spanner-core = { path = "spanner-core" }

[build-dependencies]
napi-build = "2"
