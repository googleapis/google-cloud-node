apiVersion: batch/v1
kind: Job
metadata:
  namespace: spanner-ns
  name: issue-read-node-current
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: issue-read-node-current
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: us-central1-docker.pkg.dev/span-cloud-testing/gargsurbhi-images/issue-read-node:current
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting V8 CPU Profiler benchmark with tsx..."
              /app/node_modules/.bin/tsx --cpu-prof --cpu-prof-dir=/tmp --cpu-prof-name=k8s-read-current.cpuprofile /app/benchmark-read-repl.mts
              echo "✓ Benchmark finished! Sleeping for 1 hour so you can kubectl cp the profile..."
              sleep 3600
          resources:
            requests:
              cpu: "3"
              memory: "2Gi"
            limits:
              cpu: "3"
              memory: "2Gi"
          env:
            - name: SAMPLE_SIZE
              value: "10000"
            - name: READ_COUNT
              value: "1000000"
            - name: READ_CONCURRENCY
              value: "300"
            - name: DB_PROJECT_ID
              value: "span-cloud-testing"
            - name: DB_INSTANCE
              value: "gargsurbhi-testing1"
            - name: DB_DATABASE
              value: "jack_henry_db"
            - name: DB_SCHEMA
              value: "tracking"
            - name: SPANNER_DISABLE_BUILTIN_METRICS
              value: "true"
            - name: GOOGLE_CLOUD_SPANNER_MULTIPLEXED_SESSIONS
              value: "false"
            - name: GRPC_GCP_CONFIG_PATH
              value: ""
            - name: GRPC_GCP_CONFIG_JSON
              value: '{"channelPool": {"minSize": 20, "maxSize": 40, "maxConcurrentStreamsLowWatermark": 5}}'
