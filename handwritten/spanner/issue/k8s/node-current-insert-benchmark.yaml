apiVersion: batch/v1
kind: Job
metadata:
  namespace: spanner-ns
  name: issue-insert-node-current
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: issue-insert-node-current
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: us-central1-docker.pkg.dev/span-cloud-testing/gargsurbhi-images/issue-insert-node:current
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting V8 CPU Profiler benchmark with tsx..."
              /app/node_modules/.bin/tsx --cpu-prof --cpu-prof-dir=/tmp --cpu-prof-name=k8s-insert-current.cpuprofile /app/benchmark-insert-repl.mts
              echo "✓ Benchmark finished! Sleeping for 1 hour so you can kubectl cp the profile..."
              sleep 3600
          resources:
            requests:
              cpu: "3"
              memory: "2Gi"
            limits:
              cpu: "3"
              memory: "2Gi"
          env:
            - name: SAMPLE_SIZE
              value: "10000"
            - name: INSERT_COUNT
              value: "1000"
            - name: INSERT_CONCURRENCY
              value: "110"
            - name: BATCH_COUNT
              value: "1"
            - name: DUPLICATE_INSERT
              value: "false"
            - name: VERBOSE_BATCH_LOGS
              value: "true"
            - name: DB_PROJECT_ID
              value: "span-cloud-testing"
            - name: DB_INSTANCE
              value: "gargsurbhi-testing1"
            - name: DB_DATABASE
              value: "jack_henry_db"
            - name: DB_SCHEMA
              value: "tracking"
            - name: SPANNER_DISABLE_BUILTIN_METRICS
              value: "true"
            - name: GOOGLE_CLOUD_SPANNER_MULTIPLEXED_SESSIONS
              value: "false"
