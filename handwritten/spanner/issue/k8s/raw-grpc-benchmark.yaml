apiVersion: batch/v1
kind: Job
metadata:
  namespace: spanner-ns
  name: issue-raw-grpc-node
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: issue-raw-grpc-node
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: us-central1-docker.pkg.dev/span-cloud-testing/gargsurbhi-images/issue-raw-grpc-node:latest
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Starting Raw gRPC CPU Profiler benchmark..."
              node --cpu-prof --cpu-prof-dir=/tmp --cpu-prof-name=k8s-raw-grpc.cpuprofile /app/raw_grpc_benchmark.js
              echo "✓ Benchmark finished! Sleeping for 1 hour so you can kubectl cp the profile..."
              sleep 3600
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
          env:
            - name: READ_COUNT
              value: "10000"
            - name: CONCURRENCY
              value: "110"
            - name: DB_PROJECT_ID
              value: "span-cloud-testing"
            - name: DB_INSTANCE
              value: "gargsurbhi-testing1"
            - name: DB_DATABASE
              value: "jack_henry_db"
            - name: TABLE_NAME
              value: "tracking.DeviceRecentActivityLog"
---
