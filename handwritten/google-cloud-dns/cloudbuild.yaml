steps:
# 1. Set up Node.js environment
- name: 'node:24'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    cd ../.. && corepack enable pnpm && pnpm install --filter "...{./handwritten/google-cloud-dns}"
  dir: 'handwritten/google-cloud-dns'
  id: 'install-dependencies'

# 2. Fetch service account key for system tests
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    set -o pipefail
    gcloud secrets versions access latest --project=cloud-devrel-kokoro-resources --secret=long-door-651-kokoro-system-test-service-account --format='get(payload.data)' | tr '_-' '/+' | base64 -d > /workspace/google_application_credentials.json
  id: 'get-service-account-key'

# 3. Configure environment variables for the tests and run system tests
#    - GOOGLE_APPLICATION_CREDENTIALS: Service account key from Secret Manager
#    - GCLOUD_PROJECT: Can be passed as a build variable.
- name: 'node:24'
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    corepack enable pnpm && pnpm run system-test
  dir: 'handwritten/google-cloud-dns'
  env:
  - 'GCLOUD_PROJECT=${_GCP_PROJECT_ID}' # Pass project ID via build variable
  - 'GOOGLE_APPLICATION_CREDENTIALS=/workspace/google_application_credentials.json'
  id: 'run-system-tests'
  waitFor: ['install-dependencies', 'get-service-account-key']

# Define a substitution variable for your project ID
# Replace 'long-door-651' with the actual GCP Project ID your system tests should run against.
substitutions:
  _GCP_PROJECT_ID: 'long-door-651'

timeout: '3600s'
