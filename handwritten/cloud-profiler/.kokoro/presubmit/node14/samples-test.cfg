# Format: //devtools/kokoro/config/proto/build.proto

# Point to the root trampoline script within the checked-out SCM.
# 'cloud-profiler-nodejs' is the scm.name in your job config.
build_file: "cloud-profiler-nodejs/.kokoro/trampoline.sh"

# Specify the *actual test script* to run inside the container.
# Path is relative to the SCM root.
env_vars: {
  key: "TRAMPOLINE_BUILD_FILE"
  value: "handwritten/cloud-profiler/.kokoro/samples-test.sh"
}

# Optional: Override the image if samples test needs a different Node version
# than defined in common.cfg. If not, remove this block.
# env_vars: {
#   key: "TRAMPOLINE_IMAGE"
#   value: "gcr.io/cloud-devrel-kokoro-resources/node:14"
# }
