// NOTE: This is a local copy of the pending `google/api/media_upload.proto`
// definition used to describe resumable upload methods.
// The official proto has not been published to googleapis yet; when it is,
// this file should be replaced by the upstream version and the protos bundle
// regenerated. Detection in the generator matches on the option name
// (`.google.api.mediaUpload`), so the extension number below is a
// placeholder that does not affect method identification.

syntax = "proto3";

package google.api;

import "google/api/annotations.proto";
import "google/protobuf/descriptor.proto";

option go_package = "google.golang.org/genproto/googleapis/api/annotations;annotations";

// MediaUpload describes the media upload configuration for a method that
// opts into the resumable upload protocol.
message MediaUpload {
  // Whether the method supports media upload.
  bool enabled = 1;

  // The paths to which media upload commands are sent. When present, the
  // first path is used as the upload prefix for the resumable upload
  // session (for example, `/resumable/upload`).
  repeated string media_upload_paths = 2;

  // Whether the server notifies the client when the session is started.
  bool start_notification = 3;

  // Whether the server notifies the client on each upload command.
  bool upload_notification = 4;

  // Whether the server notifies the client when the upload is finalized.
  bool finalize_notification = 5;

  // The direct upload service to use, if any.
  string direct_upload_service = 6;

  // How long, in seconds, an upload session may remain active.
  int64 max_upload_session_duration_seconds = 7;
}

// Defines a method as a media upload method. Methods annotated with this
// option are routed through the resumable upload protocol.
extend google.protobuf.MethodOptions {
  MediaUpload media_upload = 1052;
}
